<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hũ Chi Tiêu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hũ Chi Tiêu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211A29" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: phone-first single column with a fixed tab bar; ≥900px becomes sidebar + content */
:root{
  --bg:#FFF4EE; --surface:#FFFFFF; --sunk:#FCE9E1;
  --ink:#3A2A3F; --muted:#8C7A8E; --line:#F1DCD3;
  --accent:#EE7FA0; --accent-ink:#FFFFFF; --accent-soft:#FFDCE6; --rose:#FFDCE6;
  --mint:#BFE8D8; --butter:#FFEBA8; --lilac:#DCD0F7; --sky:#CDE6F7; --peach:#FFD3B8;
  --bar:#F7BFD0; --ok:#3E9C7C; --warn:#C98424; --bad:#D9556F; --warn-soft:#FFEBA8; --bad-soft:#FFD6DD;
  --shadow:0 6px 20px rgba(196,120,140,.14);
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211A29; --surface:#2C2336; --sunk:#372C43;
  --ink:#F6EAF2; --muted:#B5A3BA; --line:#43364F;
  --accent:#F49AB6; --accent-ink:#2A1A26; --accent-soft:#4A2E40; --rose:#4A2E40;
  --mint:#2F4D45; --butter:#4D4430; --lilac:#3E3560; --sky:#2C4356; --peach:#52392E;
  --bar:#7E4F67; --ok:#7FD3B2; --warn:#F0C46A; --bad:#F48C9F; --warn-soft:#4D4430; --bad-soft:#552B37;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211A29; --surface:#2C2336; --sunk:#372C43;
  --ink:#F6EAF2; --muted:#B5A3BA; --line:#43364F;
  --accent:#F49AB6; --accent-ink:#2A1A26; --accent-soft:#4A2E40; --rose:#4A2E40;
  --mint:#2F4D45; --butter:#4D4430; --lilac:#3E3560; --sky:#2C4356; --peach:#52392E;
  --bar:#7E4F67; --ok:#7FD3B2; --warn:#F0C46A; --bad:#F48C9F; --warn-soft:#4D4430; --bad-soft:#552B37;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}

.app{display:flex;min-height:100%}
.side{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.jar{width:38px;height:38px;border-radius:12px 12px 14px 14px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:20px;flex:none}
.brand h1{font-size:22px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.top-r{display:flex;align-items:center;gap:8px}
.gear{width:40px;height:40px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.gear svg{width:22px;height:22px}
.sync{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.wait i{background:var(--warn)} .sync.err i{background:var(--bad)}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h2{font-size:28px}

.demo,.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--butter);border-radius:16px;padding:10px 14px;font-size:13px}
.demo button{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.note{background:var(--sunk);color:var(--ink)}

.hero{background:var(--surface);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.lbl{color:var(--muted);font-size:13px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1}
.big span{font-size:.5em;color:var(--muted);margin-left:4px}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--sunk);border-radius:16px;padding:10px 12px;min-width:0}
.mini b{display:block;font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--muted);font-size:12px}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--mint);align-self:flex-start}
.delta.up{background:var(--peach)}

.quick{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:12px 14px;text-align:left;width:100%;color:var(--muted)}
.plus{width:34px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}

.card{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:19px}
.card-h .acts{display:flex;gap:8px}
.link{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
.btn-s{font-size:13px;font-weight:600;padding:7px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.btn-s.ghost{background:var(--sunk)}

.cat-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px}
.n{font-size:14px;font-weight:600;min-width:0}
.v{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.v small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.chg{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;background:var(--sunk);color:var(--muted)}
.chg.up{background:var(--bad-soft);color:var(--bad)} .chg.down{background:var(--mint);color:var(--ok)}

.day{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;padding:10px 2px 2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 2px;width:100%;text-align:left;border-top:1px solid var(--line)}
.day + .tx{border-top:0}
.tx .dot{width:40px;height:40px;border-radius:14px}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{color:var(--muted);font-size:12.5px}
.amt{font-weight:600;white-space:nowrap}
.tx.draft{opacity:.75}
.pend{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}

.search{width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{flex:none;padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

.seg{display:inline-flex;background:var(--sunk);border-radius:14px;padding:4px;gap:2px}
.seg button{padding:7px 14px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.navp{display:flex;align-items:center;gap:8px}
.navp button{width:36px;height:36px;border-radius:12px;background:var(--surface);font-size:18px}
.navp button:disabled{opacity:.35;cursor:default}
.navp b{font-family:var(--f-display);font-size:18px;min-width:0;text-align:center;flex:1}
.chart{width:100%;height:auto;display:block}
.ch-t{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ch-g{stroke:var(--line);stroke-width:1}
.ch-b{fill:var(--bar)} .ch-h{fill:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert .t{min-width:0}
.alert .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .t small{color:var(--muted);font-size:12.5px}
.alert .acts{display:flex;gap:6px}

.prog{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)}
.bud{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.bud:first-of-type{border-top:0}
.bud-h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.bud-h span{display:flex;gap:8px;align-items:center;min-width:0}
.bud small{color:var(--muted);font-size:12.5px}
.state{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.state.warn{background:var(--warn-soft);color:var(--warn)} .state.bad{background:var(--bad-soft);color:var(--bad)}

.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jarc{background:var(--sunk);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.jarc .top1{display:flex;gap:10px;align-items:center}
.jarc .ic{font-size:26px}
.jarc b{font-weight:600}
.jarc small{color:var(--muted);font-size:12.5px}

.debt-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.debt-sum div{background:var(--sunk);border-radius:16px;padding:10px 12px}
.debt-sum b{display:block;font-family:var(--f-display);font-size:19px}
.debt-sum small{color:var(--muted);font-size:12px}
.due{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.due.soon{background:var(--warn-soft);color:var(--warn)} .due.late{background:var(--bad-soft);color:var(--bad)}
.paidbtn{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--mint)}

.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .t{min-width:0}
.set-row small{display:block;color:var(--muted);font-size:12.5px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.catedit{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px 0}
.catedit input{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;min-width:0}
.catedit .emo{text-align:center;font-size:20px;padding:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap;grid-column:2/4}
.sw button{width:24px;height:24px;border-radius:8px;border:2px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--sunk);color:var(--bad);font-weight:700}
code{font-size:12.5px;background:var(--sunk);padding:1px 6px;border-radius:6px;word-break:break-all}
textarea{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-size:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:58px;height:58px;margin-top:-28px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:700;display:grid;place-items:center;box-shadow:0 8px 18px rgba(238,127,160,.45);transform:rotate(-4deg)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,20,40,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.switch,.switch::after{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:22px}
.x{width:36px;height:36px;border-radius:12px;background:var(--surface);font-size:18px;flex:none}
.say{width:100%;font-size:20px;padding:16px;border-radius:20px;border:2px solid var(--accent);background:var(--surface);outline:none}
.hints{display:flex;gap:8px;flex-wrap:wrap}
.hints button{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--sunk)}
.preview{background:var(--surface);border-radius:22px;padding:16px;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center}
.preview .dot{width:52px;height:52px;border-radius:18px;font-size:26px}
.pa{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1}
.pm{color:var(--muted);font-size:13px}
.guess{font-size:12px;color:var(--warn)}
.sec-l{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-size:12px}
.catgrid button span{font-size:22px}
.catgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field select{padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;width:100%;min-width:0}
.primary{width:100%;padding:15px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{width:100%;padding:13px;border-radius:16px;background:var(--surface);font-weight:600}
.danger{width:100%;padding:12px;border-radius:16px;color:var(--bad);font-weight:600;background:var(--surface)}
.danger.armed{background:var(--bad);color:var(--surface)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:70;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* gate: login + lock */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
.gate-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-card .jar{width:72px;height:72px;font-size:38px;border-radius:24px 24px 28px 28px;align-self:center}
.gate-card h2{font-size:30px}
.gate-card .field{text-align:left}
.gate-card .lnk{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.code{letter-spacing:.5em;text-align:center;font-size:24px!important}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;width:240px;flex:none;padding:24px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface)}
  .side .brand{margin-bottom:18px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:500}
  .side a svg{width:20px;height:20px}
  .side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .side .primary{margin-top:10px}
  .side .sync{margin-top:auto;align-self:flex-start}
  .tabs{display:none}
  .top{display:none}
  main{padding-block:28px 40px}
  .wrap{max-width:980px}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
  .scrim{align-items:center}
  .sheet{border-radius:28px;max-height:88vh}
  .grab{display:none}
  .toast{bottom:32px}
}
@media (max-width:899px){.grid2{display:flex;flex-direction:column;gap:18px}}
@media (max-width:380px){.chips3,.stats{grid-template-columns:1fr 1fr}}
</style>

</head>
<body>
<div class="app">
  <nav class="side" aria-label="Điều hướng">

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
const fmt = n => Math.round(n||0).toLocaleString('vi-VN');

const dayKey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const todayKey = () => dayKey(new Date());
const addDays = (k,n) => { const d=new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dayKey(d); };
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const monthOf = k => k.slice(0,7);

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
function uuidFrom(str){ // id cố định theo chuỗi, để 2 máy không tạo trùng khoản định kỳ
  let h=''; for(let s=0;s<4;s++){ let x=0x811c9dc5^(s*0x9e3779b1); for(let i=0;i<str.length;i++){ x^=str.charCodeAt(i); x=Math.imul(x,16777619);} h+=(x>>>0).toString(16).padStart(8,'0'); }
  return h.slice(0,8)+'-'+h.slice(8,12)+'-4'+h.slice(13,16)+'-a'+h.slice(17,20)+'-'+h.slice(20,32);
}

/* ============ lớp dữ liệu: ghi máy trước, đẩy cloud sau ============ */
function enqueue(op){
  if(mode!=='cloud') return;
  Q = Q.filter(o=>!(o.k===op.k && o.id===op.id));
  Q.push(op); store.set(LS.q,Q); paintSync();
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,400);
}
function put(kind,row){
  const a=S[kind], i=a.findIndex(x=>x.id===row.id);
  if(i>=0) a[i]=row; else a.push(row);
  persist(); if(!row.sample) enqueue({k:kind,op:'up',id:row.id});
}
function remove(kind,id){
  const row=S[kind].find(x=>x.id===id);
  S[kind]=S[kind].filter(x=>x.id!==id); persist();
  if(row && !row.sample) enqueue({k:kind,op:'del',id});
}
function saveSettings(){ persist(); enqueue({k:'settings',op:'up',id:'settings'}); }

async function flush(){
  if(mode!=='cloud' || !user || flushing || !Q.length){ paintSync(); return !Q.length; }
  if(!navigator.onLine){ paintSync(); return false; }
  flushing=true; paintSync();
  const snap=[...Q];
  try{
    for(const k of Object.keys(TABLE)){
      const ups = snap.filter(o=>o.k===k&&o.op==='up').map(o=>S[k].find(x=>x.id===o.id)).filter(Boolean).map(({sample,...r})=>({...r,user_id:user.id}));
      if(ups.length){ const {error}=await sb.from(TABLE[k]).upsert(ups); if(error) throw error; }
      const dels = snap.filter(o=>o.k===k&&o.op==='del').map(o=>o.id);
      if(dels.length){ const {error}=await sb.from(TABLE[k]).delete().in('id',dels); if(error) throw error; }
    }
    if(snap.some(o=>o.k==='settings')){ const {error}=await sb.from(SETTINGS_TABLE).upsert({user_id:user.id,data:S.settings,updated_at:new Date().toISOString()}); if(error) throw error; }
    Q = Q.filter(o=>!snap.includes(o)); store.set(LS.q,Q); syncErr=''; lastSync=new Date();
  }catch(e){ syncErr = e.message||String(e); }
  flushing=false; paintSync();
  if(!syncErr && Q.length){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,300); }
  return !syncErr && !Q.length;
}
async function fetchAll(table){
  let out=[], from=0;
  for(;;){
    const {data,error}=await sb.from(table).select('*').range(from,from+999);
    if(error) throw error;
    out=out.concat(data); if(data.length<1000) return out; from+=1000;
  }
}
const clean = r => { const {user_id,created_at,updated_at,...x}=r; return x; };
async function pull(){
  if(mode!=='cloud'||!user||!navigator.onLine){ paintSync(); return; }
  const ok = await flush(); if(!ok) return;
  try{
    const [tx,rc,jr,db] = await Promise.all(Object.values(TABLE).map(fetchAll));
    const st = await sb.from(SETTINGS_TABLE).select('data').eq('user_id',user.id).maybeSingle();
    if(st.error) throw st.error;
    if(Q.length) return; // có thay đổi mới trong lúc tải, để lần sau
    S.tx=tx.map(clean); S.recurring=rc.map(clean); S.jars=jr.map(clean); S.debts=db.map(clean);
    if(st.data && st.data.data) S.settings = Object.assign(blankSettings(), st.data.data);
    else enqueue({k:'settings',op:'up',id:'settings'});
    persist(); syncErr=''; lastSync=new Date();
    runRecurring(); render();
  }catch(e){ syncErr=e.message||String(e); }
  paintSync();
}
function paintSync(){
  let cls='', txt='';
  if(mode!=='cloud'){ txt='Trên máy'; }
  else if(!navigator.onLine){ cls='wait'; txt='Ngoại tuyến'+(Q.length?' · '+Q.length+' chờ':''); }
  else if(syncErr){ cls='err'; txt='Lỗi đồng bộ'; }
  else if(flushing||Q.length){ cls='wait'; txt='Đang đồng bộ…'; }
  else { cls='ok'; txt='Đã đồng bộ'; }
  document.querySelectorAll('[data-sync]').forEach(el=>{ el.className='sync '+cls; el.lastElementChild.textContent=txt; el.title=syncErr||''; });
}
window.addEventListener('online',()=>pull());
window.addEventListener('offline',paintSync);

/* ============ hiểu câu tự nhiên ============ */
function takeAmount(s){
  let m;
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:tr|trieu|cu|m)\s*(\d{1,3})?(?=\s)/))){
    let v=parseFloat(m[1].replace(',','.'))*1e6; if(m[2]) v+=parseInt(m[2],10)*({1:1e5,2:1e4,3:1e3})[m[2].length];
    return {amount:Math.round(v),guessed:false,s:s.replace(m[0],' ')};
  }
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:k|nghin|ngan|ng)(?=\s)/))) return {amount:Math.round(parseFloat(m[1].replace(',','.'))*1000),guessed:false,s:s.replace(m[0],' ')};
  if((m=s.match(/(\d{1,3}(?:[.,]\d{3})+|\d{4,})\s*(?:d|dong|vnd)?(?=\s)/))) return {amount:parseInt(m[1].replace(/[.,]/g,''),10),guessed:false,s:s.replace(m[0],' ')};
  if((m=s.match(/(?:^|\s)(\d{1,3})(?=\s)(?!\s*\/)/))) return {amount:parseInt(m[1],10)*1000,guessed:true,s:s.replace(m[0],' ')};
  return {amount:0,guessed:false,s};
}
const parseAmount = str => takeAmount(' '+norm(str)+' ').amount;
function parse(raw){
  let s=' '+norm(raw)+' ';
  const out={amount:0,guessed:false,date:todayKey(),wallet:'cash',cat:'khac',note:''};
  const a=takeAmount(s); out.amount=a.amount; out.guessed=a.guessed; s=a.s;
  let m;
  if(/\shom qua\s/.test(s)){ out.date=addDays(todayKey(),-1); s=s.replace(/\shom qua\s/,' '); }
  else if(/\shom kia\s/.test(s)){ out.date=addDays(todayKey(),-2); s=s.replace(/\shom kia\s/,' '); }
  else if(/\shom nay\s/.test(s)){ s=s.replace(/\shom nay\s/,' '); }
  else if((m=s.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/))){
    const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):new Date().getFullYear();
    const d=new Date(y,+m[2]-1,+m[1],12); if(!isNaN(d)) out.date=dayKey(d); s=s.replace(m[0],' ');
  }
  for(const w of WALLET_CK){ const re=new RegExp('\\s'+w+'\\s'); if(re.test(s)){ out.wallet='ck'; s=s.replace(re,' '); break; } }
  if(/\s(tien mat|tm|cash)\s/.test(s)){ out.wallet='cash'; s=s.replace(/\s(tien mat|tm|cash)\s/,' '); }
  const note=s.replace(/\s+/g,' ').trim();
  out.note=noteFromOriginal(raw.trim(),note);
  const L=S.settings.learned||{}, first=note.split(' ').slice(0,2).join(' ');
  const valid = id => id && cats().some(c=>c.id===id);
  if(note && valid(L[note])) out.cat=L[note];
  else if(first && valid(L[first])) out.cat=L[first];
  else{
    let best=null,bestLen=0; const pad=' '+note+' ';
    const kw = {...KEYWORDS}; cats().forEach(c=>{ const n=norm(c.name); (kw[c.id]=(kw[c.id]||[]).concat([n])); });
    for(const [cat,list] of Object.entries(kw)) if(valid(cat)) for(const k of list) if(k.length>bestLen && pad.includes(' '+k+' ')){ best=cat; bestLen=k.length; }
    out.cat=best||'khac';
  }
  return out;
}
function noteFromOriginal(orig,normNote){
  if(!normNote) return '';
  const keep=new Set(normNote.split(' '));
  const n=orig.split(/\s+/).filter(w=>keep.has(norm(w))).join(' ').trim();
  return n ? n.charAt(0).toUpperCase()+n.slice(1) : '';
}
function learn(note,cat){
  const n=norm(note); if(!n) return;
  S.settings.learned[n]=cat; S.settings.learned[n.split(' ').slice(0,2).join(' ')]=cat; saveSettings();
}

/* ============ khoản định kỳ ============ */
function runRecurring(){
  const t=todayKey(), mk=monthOf(t), dom=new Date().getDate();
  const daysIn=new Date(+mk.slice(0,4),+mk.slice(5,7),0).getDate();
  for(const r of S.recurring){
    if(!r.active || r.last_month===mk) continue;
    const day=Math.min(r.day,daysIn);
    if(dom<day) continue;
    const id = r.sample ? uuid() : uuidFrom(r.id+mk);
    if(!S.tx.some(x=>x.id===id)) put('tx',{id,date:mk+'-'+String(day).padStart(2,'0'),note:r.note,cat:r.cat,amount:r.amount,wallet:r.wallet,draft:true,recurring_id:r.id,ts:Date.now(),...(r.sample?{sample:true}:{})});
    put('recurring',{...r,last_month:mk});
  }
}

/* ============ tính toán ============ */
const sum = a => a.reduce((t,x)=>t+(+x.amount||0),0);
const inRange = (list,a,b) => list.filter(x=>x.date>=a&&x.date<=b);
function dayLabel(k){
  const t=todayKey(); if(k===t) return 'Hôm nay'; if(k===addDays(t,-1)) return 'Hôm qua';
  const d=new Date(k+'T12:00:00');
  return ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'/'+d.getFullYear():'');
}
const walletLabel = w => w==='ck'?'Chuyển khoản':'Tiền mặt';
function monthSpent(cat){ const mk=monthOf(todayKey()); return sum(live().filter(x=>monthOf(x.date)===mk && (!cat||x.cat===cat))); }
function budgetState(spent,limit){ if(!limit) return ''; const p=spent/limit; return p>=1?'bad':p>=.8?'warn':''; }
function checkBudget(cat,before,after){
  const b=S.settings.budgets[cat], c=catById(cat), msgs=[];
  if(b){ if(before<b&&after>=b) msgs.push('Vượt ngân sách '+c.name+' ('+fmtShort(after)+'/'+fmtShort(b)+')'); else if(before<.8*b&&after>=.8*b) msgs.push('Đã dùng 80% ngân sách '+c.name); }
  const T=S.settings.total;
  if(T&&!msgs.length){ const tb=monthSpent()-(after-before), ta=monthSpent(); if(tb<T&&ta>=T) msgs.push('Đã vượt tổng ngân sách tháng'); else if(tb<.8*T&&ta>=.8*T) msgs.push('Đã dùng 80% tổng ngân sách tháng'); }
  return msgs[0]||'';
}
function dueInfo(due){
  if(!due) return {cls:'',txt:'Không hạn'};
  const d=dayDiff(todayKey(),due);
  if(d<0) return {cls:'late',txt:'Quá hạn '+(-d)+' ngày'};
  if(d===0) return {cls:'soon',txt:'Hôm nay'};
  if(d<=3) return {cls:'soon',txt:'Còn '+d+' ngày'};
  return {cls:'',txt:'Hạn '+fmtD(due)};
}

/* ============ thành phần giao diện ============ */
function txRow(x){
  const c=catById(x.cat);
  return `<button class="tx${x.draft?' draft':''}" data-edit="${x.id}">
    <span class="dot" style="background:${catBg(c)}">${c.icon}</span>
    <span class="t"><b>${esc(x.note||c.name)}</b><small>${esc(c.name)} · ${walletLabel(x.wallet)}${x.draft?'<span class="pend">Chờ xác nhận</span>':''}</small></span>
    <span class="amt num">−${fmt(x.amount)}đ</span></button>`;
}
function grouped(list){
  const by={}; list.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
  return Object.keys(by).sort().reverse().map(k=>`<div class="day"><span>${dayLabel(k)}</span><span class="num">−${fmt(sum(by[k].filter(x=>!x.draft)))}đ</span></div>`+by[k].sort((a,b)=>(b.ts||0)-(a.ts||0)).map(txRow).join('')).join('');
}
const gearIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`;
const mobileTop = sub => `<div class="top"><div class="brand"><div class="jar">H</div><h1>Hũ Chi Tiêu<small>${sub}</small></h1></div>
  <div class="top-r"><span class="sync" data-sync><i></i><span>…</span></span><a class="gear" href="#cai-dat" aria-label="Cài đặt">${gearIcon}</a></div></div>`;
const demoBanner = () => hasSample()?`<div class="demo"><span>Đang hiển thị <b>dữ liệu mẫu</b> để bạn xem thử.</span><button data-act="clear-sample">Xoá dữ liệu mẫu</button></div>`:'';
function catRows(entries,total,prevMap){
  const max=entries.length?entries[0][1]:1;
  return entries.map(([id,v])=>{ const c=catById(id); let chg='';
    if(prevMap){ const p=prevMap[id]||0; if(p>0){ const d=Math.round((v-p)/p*100); chg=`<span class="chg ${d>0?'up':d<0?'down':''}">${d>0?'+':''}${d}%</span>`; } else chg='<span class="chg">mới</span>'; }
    return `<div class="cat-row"><span class="dot" style="background:${catBg(c)}">${c.icon}</span>
      <div style="min-width:0"><div class="n">${esc(c.name)}${chg}</div><div class="bar"><i style="width:${Math.max(4,v/max*100)}%;background:${BAR[c.color]||BAR.sunk}"></i></div></div>
      <div class="v num">${fmtShort(v)}<small>${total?Math.round(v/total*100):0}%</small></div></div>`; }).join('');
}
function byCat(list){ const m={}; list.forEach(x=>m[x.cat]=(m[x.cat]||0)+(+x.amount)); return m; }

/* ============ màn Báo cáo ============ */
let rp={mode:'month',off:0};
function period(mode,off){
  const now=new Date();
  if(mode==='week'){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12); d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
    const start=dayKey(d), end=addDays(start,6);
    return {start,end,title:fmtD(start)+' – '+fmtD(end),unit:'tuần',buckets:['T2','T3','T4','T5','T6','T7','CN'].map((l,i)=>({from:addDays(start,i),to:addDays(start,i),label:l}))};
  }
  if(mode==='year'){
    const y=now.getFullYear()+off;
    return {start:y+'-01-01',end:y+'-12-31',title:'Năm '+y,unit:'năm',buckets:[...Array(12)].map((_,i)=>{const m=String(i+1).padStart(2,'0');return {from:`${y}-${m}-01`,to:`${y}-${m}-${new Date(y,i+1,0).getDate()}`,label:'T'+(i+1)};})};
  }
  const d=new Date(now.getFullYear(),now.getMonth()+off,1,12), y=d.getFullYear(), m=d.getMonth(), n=new Date(y,m+1,0).getDate();
  const mm=String(m+1).padStart(2,'0');
  return {start:`${y}-${mm}-01`,end:`${y}-${mm}-${n}`,title:'Tháng '+(m+1)+'/'+y,unit:'tháng',buckets:[...Array(n)].map((_,i)=>{const k=`${y}-${mm}-${String(i+1).padStart(2,'0')}`;return {from:k,to:k,label:String(i+1)};})};
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))); for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p; return 10*p; }
function barChart(vals,labels,hiIdx,aria){
  const W=640,H=210,pl=46,pr=6,pt=10,pb=24, n=vals.length, max=niceMax(Math.max(...vals,1));
  const cw=(W-pl-pr)/n, bw=Math.max(3,Math.min(30,cw*.64)), ih=H-pt-pb;
  const step=n>20?5:n>12?2:1;
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ih-f*ih; g+=`<line class="ch-g" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ch-t" x="${pl-6}" y="${y+4}" text-anchor="end">${fmtShort(max*f)}</text>`;});
  vals.forEach((v,i)=>{ const h=v/max*ih, x=pl+i*cw+(cw-bw)/2, y=pt+ih-h;
    if(v>0) g+=`<rect class="${i===hiIdx?'ch-h':'ch-b'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1.5).toFixed(1)}" rx="${Math.min(6,bw/2).toFixed(1)}"><title>${labels[i]}: ${fmt(v)}đ</title></rect>`;
    if(i%step===0||i===n-1) g+=`<text class="ch-t" x="${(pl+i*cw+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}
function viewReport(){
  const P=period(rp.mode,rp.off), PP=period(rp.mode,rp.off-1), t=todayKey(), L=live();
  const curEnd = P.end>t?t:P.end, elapsed=Math.max(0,dayDiff(P.start,curEnd));
  const prevEnd = rp.off===0 ? (addDays(PP.start,elapsed)>PP.end?PP.end:addDays(PP.start,elapsed)) : PP.end;
  const cur=inRange(L,P.start,P.end), prev=inRange(L,PP.start,prevEnd);
  const total=sum(cur), pt=sum(prev);
  const vals=P.buckets.map(b=>sum(inRange(L,b.from,b.to)));
  let hi=-1; vals.forEach((v,i)=>{ if(v>0&&(hi<0||v>vals[hi])) hi=i; });
  const days=P.start>t?0:dayDiff(P.start,curEnd)+1;
  const cm=byCat(cur), pm=byCat(prev), entries=Object.entries(cm).sort((a,b)=>b[1]-a[1]);
  const top=[...cur].sort((a,b)=>b.amount-a.amount).slice(0,5);
  let d=''; if(pt>0){ const p=Math.round((total-pt)/pt*100); d=`<span class="chg ${p>0?'up':p<0?'down':''}" style="margin:0">${p>0?'+':''}${p}%</span>`; }
  return `${mobileTop('Báo cáo')}
  <div class="page-h"><h2>Báo cáo</h2>
    <div class="seg" role="group" aria-label="Kỳ báo cáo">${[['week','Tuần'],['month','Tháng'],['year','Năm']].map(([k,l])=>`<button data-rm="${k}" aria-pressed="${rp.mode===k}">${l}</button>`).join('')}</div></div>
  <section class="card" style="gap:12px">
    <div class="navp"><button data-roff="-1" aria-label="Kỳ trước">‹</button><b>${P.title}</b><button data-roff="1" aria-label="Kỳ sau" ${rp.off>=0?'disabled':''}>›</button></div>
    <div class="stats">
      <div class="mini"><small>Tổng chi</small><b class="num">${fmtShort(total)}</b></div>
      <div class="mini"><small>TB / ngày</small><b class="num">${fmtShort(days?total/days:0)}</b></div>
      <div class="mini"><small>So kỳ trước</small><b>${d||'—'}</b></div>
    </div>
    ${total?barChart(vals,P.buckets.map(b=>b.label),hi,'Chi tiêu '+P.title):'<div class="empty">Kỳ này chưa có khoản chi nào.</div>'}
    ${hi>=0?`<p class="lbl">Chi nhiều nhất: ${rp.mode==='year'?'tháng '+(hi+1):rp.mode==='week'?P.buckets[hi].label+' ('+fmtD(P.buckets[hi].from)+')':'ngày '+(hi+1)} · ${fmt(vals[hi])}đ${rp.off===0&&pt>0?' · so sánh với cùng số ngày của kỳ trước':''}</p>`:''}
  </section>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Theo danh mục</h2><span class="lbl">% so với kỳ trước</span></div>
      ${entries.length?catRows(entries,total,pm):'<div class="empty">Chưa có dữ liệu.</div>'}</section>
    <section class="card"><div class="card-h"><h2>Khoản lớn nhất</h2></div>
      ${top.length?top.map(txRow).join(''):'<div class="empty">Chưa có dữ liệu.</div>'}</section>
  </div>`;
}

let draft=null, manualCat=null;
function openAdd(){
  if(!document.getElementById('gate').hidden) return;
  manualCat=null; draft=parse('');
  const hints=['cafe 45k','grab 32k ck','cơm trưa 55k hôm qua','tiền điện 412k ck','shopee 1tr2 ck'];
  openSheet(`${sheetHead('Ghi khoản chi')}
  <input class="say" id="say" autocomplete="off" enterkeyhint="done" placeholder="cafe 45k" aria-label="Gõ khoản chi">
  <div class="hints">${hints.map(h=>`<button data-hint="${h}">${h}</button>`).join('')}</div>
  <div class="preview" id="pv"></div>
  <div class="sec-l">Danh mục · bấm để sửa, app sẽ nhớ</div>
  <div class="catgrid" id="cg"></div>
  <div class="row2"><label class="field">Ngày<input type="date" id="d"></label>
    <label class="field">Nguồn tiền<select id="w"><option value="cash">Tiền mặt</option><option value="ck">Chuyển khoản</option></select></label></div>
  <button class="primary" id="save" disabled>Lưu khoản chi</button>`);
  const say=document.getElementById('say');
  say.addEventListener('input',()=>updateDraft(say.value));
  say.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
  document.getElementById('d').onchange=e=>{ draft.date=e.target.value||todayKey(); draft._d=1; paintDraft(); };
  document.getElementById('w').onchange=e=>{ draft.wallet=e.target.value; draft._w=1; paintDraft(); };
  document.getElementById('save').onclick=commit;
  paintDraft(); setTimeout(()=>say.focus(),60);
}
function updateDraft(v){
  const p=parse(v);
  if(draft._d){ p.date=draft.date; p._d=1; }
  if(draft._w){ p.wallet=draft.wallet; p._w=1; }
  draft=p; if(manualCat) draft.cat=manualCat; paintDraft();
}
function paintDraft(){
  const c=catById(draft.cat);
  document.getElementById('pv').innerHTML=`<span class="dot" style="background:${catBg(c)}">${c.icon}</span>
    <div style="min-width:0"><div class="pa num">${fmt(draft.amount)}đ</div>
    <div class="pm">${esc(draft.note||'Chưa có ghi chú')} · ${esc(c.name)} · ${dayLabel(draft.date)} · ${walletLabel(draft.wallet)}</div>
    ${draft.guessed?'<div class="guess">Hiểu là nghìn đồng. Gõ thêm “k” hoặc số đầy đủ nếu khác.</div>':''}</div>`;
  document.getElementById('cg').innerHTML=cats().map(x=>`<button data-cat="${x.id}" aria-pressed="${x.id===draft.cat}"><span>${x.icon}</span>${esc(x.name)}</button>`).join('');
  document.getElementById('d').value=draft.date; document.getElementById('w').value=draft.wallet;
  document.getElementById('save').disabled=!draft.amount;
}
function commit(){
  if(!draft||!draft.amount) return;
  if(manualCat) learn(draft.note,manualCat);
  const c=catById(draft.cat), before=monthOf(draft.date)===monthOf(todayKey())?monthSpent(draft.cat):null;
  put('tx',{id:uuid(),date:draft.date,note:draft.note||c.name,cat:draft.cat,amount:draft.amount,wallet:draft.wallet,draft:false,recurring_id:null,ts:Date.now()});
  const warn = before!==null ? checkBudget(draft.cat,before,monthSpent(draft.cat)) : '';
  toast(warn?'⚠️ '+warn:'Đã lưu '+fmt(draft.amount)+'đ · '+c.name, warn?3500:2400);
  closeSheet();
}

  const isNew=!S.debts.some(x=>x.id===d.id); let kind=d.kind;
  openSheet(`${sheetHead(isNew?'Ghi khoản mượn':'Sửa khoản mượn')}
  <div class="seg" role="group" aria-label="Loại" id="k-seg"><button data-k="lend" aria-pressed="${kind==='lend'}">Mình cho mượn</button><button data-k="borrow" aria-pressed="${kind==='borrow'}">Mình đi vay</button></div>
  <div class="row2"><label class="field">Người<input id="k-p" value="${esc(d.person)}" placeholder="vd Minh"></label><label class="field">Số tiền<input id="k-a" inputmode="decimal" value="${d.amount?fmt(d.amount):''}" placeholder="vd 500k"></label></div>
  <div class="row2"><label class="field">Hạn trả<input id="k-due" type="date" value="${d.due||''}"></label><label class="field">Ghi chú<input id="k-n" value="${esc(d.note)}"></label></div>
  ${isNew?'':`<div class="set-row"><div class="t"><b>Đã trả xong</b></div><button class="switch" role="switch" id="k-paid" aria-checked="${!!d.paid}" aria-label="Đã trả xong"></button></div>`}
  <button class="primary" id="k-save">Lưu</button>${isNew?'':'<button class="danger" id="k-del">Xoá</button>'}`);
  document.getElementById('k-seg').onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; kind=b.dataset.k; document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===kind)); };
  const pb=document.getElementById('k-paid'); if(pb) pb.onclick=()=>pb.setAttribute('aria-checked',pb.getAttribute('aria-checked')!=='true');
  document.getElementById('k-save').onclick=()=>{
    const amount=parseAmount(val('k-a')), person=val('k-p').trim(); if(!person||!amount){ toast('Cần tên người và số tiền'); return; }
    put('debts',{...d,kind,person,amount,due:val('k-due')||null,note:val('k-n').trim(),paid:pb?pb.getAttribute('aria-checked')==='true':false}); toast('Đã lưu'); closeSheet();
  };
  const del=document.getElementById('k-del'); if(del) armDelete(del,()=>{ remove('debts',d.id); toast('Đã xoá'); closeSheet(); });
}

/* ============ cài đặt: hành động ============ */
function getCfg(){ const s=store.get(LS.cfg,{}); if(s.off) return {url:'',key:''}; return {url:s.url||CONFIG.SUPABASE_URL||'',key:s.key||CONFIG.SUPABASE_ANON_KEY||''}; }
function readCatEdits(){
  return [...document.querySelectorAll('#catlist .catedit')].map(r=>{ const old=cats().find(c=>c.id===r.dataset.cid)||{};
    return {id:r.dataset.cid,icon:r.querySelector('.emo').value.trim()||'✨',name:r.querySelector('.cn').value.trim()||'Không tên',color:(r.querySelector('[data-sw][aria-pressed="true"]')||{}).dataset?.sw||old.color||'sunk'}; });
}
function exportData(){
  const data=JSON.stringify({app:'hu-chi-tieu',version:2,exported:new Date().toISOString(),tx:S.tx,recurring:S.recurring,jars:S.jars,debts:S.debts,settings:S.settings},null,1);
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='hu-chi-tieu-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  const ta=document.getElementById('exp-out'); ta.hidden=false; ta.value=data;
  if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>toast('Đã tải file và sao chép dữ liệu'),()=>{ ta.select(); toast('Đã tạo dữ liệu xuất bên dưới'); });
}
function importFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const d=JSON.parse(rd.result); if(d.app!=='hu-chi-tieu') throw new Error('Không phải file của Hũ Chi Tiêu');
      let n=0; for(const k of Object.keys(TABLE)) (d[k]||[]).forEach(r=>{ if(r&&r.id){ const {sample,...x}=r; put(k,x); n++; } });
      if(d.settings){ const ids=new Set(cats().map(c=>c.id)); (d.settings.cats||[]).forEach(c=>{ if(!ids.has(c.id)) S.settings.cats.push(c); });
        Object.assign(S.settings.learned,d.settings.learned||{}); saveSettings(); }
      toast('Đã nhập '+n+' mục'); render();
    }catch(err){ toast('Không đọc được file: '+err.message,3500); } };
  rd.readAsText(f);
}

/* ============ Face ID (passkey trên máy) ============ */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function faceRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:rand(32),rp:{name:'Hũ Chi Tiêu',id:location.hostname},
    user:{id:rand(16),name:user?user.email:'hu-chi-tieu',displayName:'Hũ Chi Tiêu'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
  store.set(LS.face,{on:true,id:b64(cred.rawId)});
}
async function faceCheck(){
  const f=store.get(LS.face,null);
  await navigator.credentials.get({publicKey:{challenge:rand(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64(f.id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}});
}
const gate=document.getElementById('gate');
let hiddenAt=0, locked=false;
function showLock(){
  const f=store.get(LS.face,null); if(!f||!f.on) return false;
  locked=true; gate.hidden=false;
  gate.innerHTML=`<div class="gate-card"><div class="jar">H</div><h2>Hũ Chi Tiêu</h2><p class="lbl">Mở khoá để xem sổ chi tiêu</p>
    <button class="primary" id="unlock">Mở khoá bằng Face ID</button><p class="err" id="lock-err" hidden></p>
    <button class="lnk" id="lock-off">Không mở được? Đăng xuất để đăng nhập lại</button></div>`;
  const go=async()=>{ try{ await faceCheck(); locked=false; gate.hidden=true; gate.innerHTML=''; if(location.hash==='#nhap') openAdd(); }
    catch(e){ const er=document.getElementById('lock-err'); if(er){ er.hidden=false; er.textContent='Chưa xác thực được. Bấm thử lại.'; } } };
  document.getElementById('unlock').onclick=go;
  document.getElementById('lock-off').onclick=async()=>{ store.del(LS.face); await logout(true); };
  go();
  return true;
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(!locked && hiddenAt && Date.now()-hiddenAt>60000) showLock();
  if(mode==='cloud'&&user) pull();
});

/* ============ đăng nhập bằng email + mật khẩu ============ */
const appUrl = () => location.origin + location.pathname;
const authMsg = m => /invalid login/i.test(m)?'Sai email hoặc mật khẩu.'
  : /not confirmed/i.test(m)?'Email chưa được xác nhận. Mở hộp thư, bấm link xác nhận rồi đăng nhập lại.'
  : /already registered|already exists/i.test(m)?'Email này đã có tài khoản. Chuyển sang Đăng nhập.'
  : /rate limit|too many/i.test(m)?'Gửi quá nhiều lần. Đợi vài phút rồi thử lại.'
  : /at least|weak|password should/i.test(m)?'Mật khẩu cần ít nhất 6 ký tự.'
  : /signups? not allowed|signup is disabled/i.test(m)?'Project Supabase đang tắt đăng ký tài khoản mới.'
  : m;
function showLogin(msg, tab){
  tab = tab || 'in';
  gate.hidden=false;
  const T={in:['Đăng nhập','Đăng nhập'],up:['Tạo tài khoản','Tạo tài khoản'],reset:['Quên mật khẩu','Gửi link đặt lại']};
  gate.innerHTML=`<div class="gate-card"><div class="jar">H</div><h2>Hũ Chi Tiêu</h2>
    ${tab==='reset'?'<p class="lbl">Nhập email, app gửi link để đặt mật khẩu mới.</p>':
      `<div class="seg" role="group" aria-label="Chọn" style="align-self:center"><button data-lt="in" aria-pressed="${tab==='in'}">Đăng nhập</button><button data-lt="up" aria-pressed="${tab==='up'}">Tạo tài khoản</button></div>`}
    <label class="field">Email<input id="lg-email" type="email" autocomplete="email" inputmode="email" placeholder="ban@gmail.com"></label>
    ${tab==='reset'?'':`<label class="field">Mật khẩu<input id="lg-pw" type="password" autocomplete="${tab==='up'?'new-password':'current-password'}" placeholder="Ít nhất 6 ký tự"></label>`}
    <button class="primary" id="lg-go">${T[tab][1]}</button>
    <p class="err" id="lg-err" ${msg?'':'hidden'}>${esc(msg||'')}</p>
    <p class="lbl" id="lg-ok" hidden></p>
    ${tab==='in'?'<button class="lnk" data-lt="reset">Quên mật khẩu?</button>':tab==='reset'?'<button class="lnk" data-lt="in">Quay lại đăng nhập</button>':''}
    <button class="lnk" id="lg-cfg">Dùng project Supabase khác</button></div>`;
  const err=t=>{ const e=document.getElementById('lg-err'); e.hidden=!t; e.textContent=t||''; };
  const ok=t=>{ const e=document.getElementById('lg-ok'); e.hidden=!t; e.textContent=t||''; };
  const emailEl=document.getElementById('lg-email'); emailEl.value=store.get('hct_email','');
  gate.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>showLogin('',b.dataset.lt));
  const go=document.getElementById('lg-go');
  const submit=async()=>{
    const email=emailEl.value.trim(), pwEl=document.getElementById('lg-pw'), password=pwEl?pwEl.value:'';
    if(!/^\S+@\S+\.\S+$/.test(email)){ err('Email chưa đúng định dạng'); return; }
    if(tab!=='reset' && password.length<6){ err('Mật khẩu cần ít nhất 6 ký tự'); return; }
    go.disabled=true; err(''); ok(''); store.set('hct_email',email);
    try{
      if(tab==='in'){
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        gate.hidden=true; gate.innerHTML=''; await onLogin(data.user,true); return;
      }
      if(tab==='up'){
        const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:appUrl()}});
        if(error) throw error;
        if(data.session){ gate.hidden=true; gate.innerHTML=''; await onLogin(data.user,true); return; }
        if(data.user && data.user.identities && !data.user.identities.length) throw new Error('already registered');
        showLogin('', 'in');
        const o=document.getElementById('lg-ok'); o.hidden=false;
        o.textContent='Đã gửi email xác nhận tới '+email+'. Bấm link trong email (mở ở đâu cũng được), rồi quay lại đây đăng nhập.';
        return;
      }
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
      if(error) throw error;
      ok('Đã gửi link tới '+email+'. Mở link trên máy này để đặt mật khẩu mới.');
    }catch(e){ err(authMsg(e.message||String(e))); }
    go.disabled=false;
  };
  go.onclick=submit;
  gate.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }));
  document.getElementById('lg-cfg').onclick=()=>{ store.set(LS.cfg,{off:true}); location.hash='#cai-dat'; location.reload(); };
}
function showNewPassword(){
  gate.hidden=false;
  gate.innerHTML=`<div class="gate-card"><div class="jar">H</div><h2>Đặt mật khẩu mới</h2>
    <label class="field">Mật khẩu mới<input id="np" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></label>
    <button class="primary" id="np-go">Lưu mật khẩu</button><p class="err" id="np-err" hidden></p></div>`;
  document.getElementById('np-go').onclick=async e=>{
    const p=val('np'), er=document.getElementById('np-err');
    if(p.length<6){ er.hidden=false; er.textContent='Mật khẩu cần ít nhất 6 ký tự'; return; }
    e.target.disabled=true;
    const {data,error}=await sb.auth.updateUser({password:p});
    e.target.disabled=false;
    if(error){ er.hidden=false; er.textContent=authMsg(error.message); return; }
    gate.hidden=true; gate.innerHTML=''; toast('Đã đổi mật khẩu'); await onLogin(data.user,false);
  };
}
async function onLogin(u, fresh){
  user=u;
  const owner=store.get(LS.owner,null);
  if(owner && owner!==u.id){ S=blank(); Q=[]; store.set(LS.q,Q); persist(); }
  else if(!owner){ // lần đầu nối cloud: đưa dữ liệu thật đang có trên máy lên
    clearSample();
    for(const k of Object.keys(TABLE)) S[k].forEach(r=>enqueue({k,op:'up',id:r.id}));
    if(S.tx.length||S.settings.cats.length) enqueue({k:'settings',op:'up',id:'settings'});
  }
  store.set(LS.owner,u.id);
  render();
  if(fresh && window.PublicKeyCredential && !store.get(LS.face,null)) setTimeout(()=>toast('Mẹo: bật Khoá bằng Face ID trong Cài đặt',3500),800);
  await pull();
  if(location.hash==='#nhap' && !locked) openAdd();
}
async function logout(keepCfg){
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  store.del(LS.data); store.del(LS.q); store.del(LS.owner); store.del(LS.face);
  if(!keepCfg) store.del(LS.cfg);
  location.hash='#tong-quan'; location.reload();
}

/* ============ bấm chung ============ */
document.addEventListener('click',async e=>{
  const t=e.target, A=t.closest('[data-act]'), act=A&&A.dataset.act;
  if(t.closest('[data-open-add]')){ openAdd(); return; }
  if(t.closest('[data-close]')){ closeSheet(); return; }
  const h=t.closest('[data-hint]'); if(h){ const s=document.getElementById('say'); s.value=h.dataset.hint; updateDraft(s.value); s.focus(); return; }
  const c=t.closest('[data-cat]'); if(c){ manualCat=c.dataset.cat; draft.cat=manualCat; paintDraft(); return; }
  const ed=t.closest('[data-edit]'); if(ed){ openEdit(ed.dataset.edit); return; }
  const cf=t.closest('[data-confirm]'); if(cf){ const x=S.tx.find(y=>y.id===cf.dataset.confirm); if(x){ put('tx',{...x,draft:false}); toast('Đã xác nhận '+x.note); render(); } return; }
  const sk=t.closest('[data-skip]'); if(sk){ remove('tx',sk.dataset.skip); toast('Đã bỏ qua tháng này'); render(); return; }
  const f=t.closest('[data-f]'); if(f){ filterCat=f.dataset.f; render(); return; }
  const rm=t.closest('[data-rm]'); if(rm){ rp={mode:rm.dataset.rm,off:0}; render(); return; }
  const ro=t.closest('[data-roff]'); if(ro){ rp.off=Math.min(0,rp.off+ +ro.dataset.roff); render(); return; }
  const rc=t.closest('[data-rec]'); if(rc){ openRec(rc.dataset.rec); return; }
  const jr=t.closest('[data-jar]'); if(jr){ openJar(jr.dataset.jar); return; }
  const db=t.closest('[data-debt]'); if(db){ openDebt(db.dataset.debt); return; }
  const pd=t.closest('[data-paid]'); if(pd){ const d=S.debts.find(x=>x.id===pd.dataset.paid); if(d){ put('debts',{...d,paid:true}); toast('Đã đánh dấu trả xong'); render(); } return; }
  const sw=t.closest('[data-sw]'); if(sw){ sw.parentElement.querySelectorAll('[data-sw]').forEach(b=>b.setAttribute('aria-pressed',b===sw)); return; }
  const cd=t.closest('[data-catdel]'); if(cd){
    if(!cd.classList.contains('armed')){ cd.classList.add('armed'); cd.textContent='?'; cd.style.background='var(--bad)'; cd.style.color='var(--surface)'; cd.setAttribute('aria-label','Bấm lần nữa để xoá'); return; }
    const id=cd.dataset.catdel;
    S.settings.cats=readCatEdits().filter(x=>x.id!==id);
    S.tx.filter(x=>x.cat===id).forEach(x=>put('tx',{...x,cat:'khac'}));
    S.recurring.filter(x=>x.cat===id).forEach(x=>put('recurring',{...x,cat:'khac'}));
    delete S.settings.budgets[id];
    for(const k in S.settings.learned) if(S.settings.learned[k]===id) delete S.settings.learned[k];
    saveSettings(); toast('Đã xoá danh mục'); render(); return;
  }
  switch(act){
    case 'clear-sample': clearSample(); render(); toast('Đã xoá dữ liệu mẫu'); break;
    case 'budget': openBudget(); break;
    case 'rec-new': openRec(null); break;
    case 'jar-new': openJar(null); break;
    case 'debt-new': openDebt(null); break;
    case 'toggle-paid': showPaid=!showPaid; render(); break;
    case 'sync-now': await pull(); toast(syncErr?'Lỗi: '+syncErr:'Đã đồng bộ'); render(); break;
    case 'logout': if(Q.length && !A.classList.contains('armed')){ A.classList.add('armed'); A.textContent='Còn '+Q.length+' thay đổi chưa đồng bộ. Bấm lần nữa'; return; } logout(true); break;
    case 'cfg-clear': store.set(LS.cfg,{off:true}); store.del(LS.owner); store.del(LS.q); location.reload(); break;
    case 'cfg-save': { const url=val('cfg-url').trim().replace(/\/+$/,''), key=val('cfg-key').trim();
      if(!url && !key && CONFIG.SUPABASE_URL){ store.del(LS.cfg); location.hash='#tong-quan'; location.reload(); return; }
      if(!/^https:\/\/.+/.test(url)||key.length<20){ toast('Kiểm tra lại URL và key',3000); return; }
      store.set(LS.cfg,{url,key}); location.hash='#tong-quan'; location.reload(); break; }
    case 'face': { const on=A.getAttribute('aria-checked')==='true';
      if(on){ store.del(LS.face); toast('Đã tắt khoá Face ID'); render(); return; }
      try{ await faceRegister(); toast('Đã bật khoá Face ID'); }catch(err){ toast('Không bật được Face ID: '+(err.name==='NotAllowedError'?'bạn đã huỷ hoặc trình duyệt chặn':err.message),3800); }
      render(); break; }
    case 'export': exportData(); break;
    case 'cat-add': { const list=document.getElementById('catlist'); const id='c'+Date.now().toString(36);
      list.insertAdjacentHTML('beforeend',catEditRow({id,name:'',icon:'🏷️',color:'lilac'})); list.lastElementChild.querySelector('.cn').focus(); break; }
    case 'cat-save': S.settings.cats=readCatEdits(); if(!S.settings.cats.some(c=>c.id==='khac')) S.settings.cats.push({...DEFAULT_CATS[8]}); saveSettings(); toast('Đã lưu danh mục'); render(); break;
  }
});

/* ============ khởi động ============ */
const isRecovery = /type=recovery/.test(location.hash);
if(/access_token=|error_description=/.test(location.hash)) window.__authHash = location.hash;
async function boot(){
  const cfg=getCfg();
  if(cfg.url&&cfg.key&&window.supabase){
    try{ sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); mode='cloud'; }catch(e){ mode='local'; }
  }
  if(mode==='local'){
    if(firstRun && !S.tx.length) sampleData();
    runRecurring(); render(); showLock();
    if(location.hash==='#nhap' && !locked) openAdd();
    return;
  }
  render(); paintSync();
  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(/access_token=|error_description=/.test(location.hash)) history.replaceState(null,'',location.pathname+'#tong-quan');
  if(isRecovery && session){ showNewPassword(); return; }
  const authErr = (window.__authHash||'').match(/error_description=([^&]+)/);
  if(!session && authErr){ showLogin('Link không dùng được: '+decodeURIComponent(authErr[1].replace(/\+/g,' '))+'. Thử lại.'); return; }
  if(!session){
    if(!navigator.onLine && store.get(LS.owner,null)){ syncErr='Ngoại tuyến'; runRecurring(); render(); showLock(); return; }
    showLogin(); return;
  }
  showLock();
  await onLogin(session.user,false);
}
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
boot();
</script>
